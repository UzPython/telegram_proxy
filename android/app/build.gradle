plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'uz.telegramproxy.mobile'
    compileSdk 33

    defaultConfig {
        applicationId 'uz.telegramproxy.mobile'
        minSdk 24
        targetSdk 33
        versionCode 1
        versionName '1.0'

        ndk {
            abiFilters 'arm64-v8a', 'x86_64'
        }
    }
}

chaquopy {
    defaultConfig {
        version = '3.10'
        pip {
            install 'cryptography'
        }
    }

    sourceSets {
        main {
            srcDir '../..'
            include 'config.py', 'mtprotoproxy.py', 'android_entry.py'
        }
    }
}
